<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TikTok Login - Authorization Code</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 60px auto; line-height: 1.6;">
<h2>인증 완료</h2>
<p>아래 코드를 복사해서 터미널에 붙여넣으세요:</p>
<div style="background:#f2f2f2; padding: 16px; border-radius: 8px; word-break: break-all; font-family: monospace; font-size: 14px;" id="code-box">
(코드를 불러오는 중...)
</div>
<button onclick="copyCode()" style="margin-top: 16px; padding: 10px 20px; font-size: 14px; cursor: pointer;">코드 복사</button>
<p id="copy-status" style="color: green;"></p>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const error = params.get("error");
const box = document.getElementById("code-box");
if (code) {
  box.textContent = code;
} else if (error) {
  box.textContent = "에러 발생: " + error + " / " + (params.get("error_description") || "");
} else {
  box.textContent = "코드를 찾을 수 없습니다. URL을 확인하세요.";
}

function copyCode() {
  navigator.clipboard.writeText(box.textContent).then(() => {
    document.getElementById("copy-status").textContent = "복사되었습니다!";
  });
}
</script>
</body>
</html>
